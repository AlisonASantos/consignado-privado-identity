version: '3.8'

services:
  consignado.identity.webapi:
    container_name: consignado_identity_webapi
    image: ${DOCKER_REGISTRY-}consignadoidentitywebapi
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "8080"
      - "8081"
    depends_on:
      - consignado.identity.database
      - consignado.identity.cache

  consignado.identity.database:
    container_name: consignado_identity_database
    image: postgres:latest
    environment:
      POSTGRES_DB: consignado_identity
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: ev@luAt10n
    ports:
      - "5432:5432"
    restart: unless-stopped

  consignado.identity.cache:
    container_name: consignado_identity_cache
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
