version: '3.8'

services:
  consignado.identity.webapi:
    container_name: consignado_identity_webapi
    image: ${DOCKER_REGISTRY-}consignadoidentitywebapi
    build:
      context: .
      dockerfile: src/ConsignadoPrivado.Identity.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080"

  consignado.identity.database:
    container_name: consignado_identity_database
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consignado_identity}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432"
    restart: unless-stopped
